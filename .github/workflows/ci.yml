name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 11 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Use `npm install`, not `npm ci`: the lockfile is generated on Windows
        # and npm ci strictly rejects the platform-specific optional deps the
        # Linux runner resolves differently (e.g. @emnapi/*). install reconciles.
        run: npm install --no-audit --no-fund

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify application
        run: npm run verify

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
